name: Java Maven Build and Docker

on:
  release:
    types: [created]
  workflow_dispatch:

# The workflow only reads the repository; `packages: write` is what lets the
# job push the released image to GHCR with the built-in token.
permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B -ntp -DskipTests package

      # Build metadata baked into the image as OCI labels, so a running
      # container can be traced back to the commit it was built from.
      - name: Collect image metadata
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0-${GITHUB_SHA::7}"
          fi
          {
            echo "version=${version}"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # A single-arch build first, loaded into the local daemon, so the image is
      # actually executed before anything is published. Buildx cannot --load a
      # multi-platform image, hence the two builds; the GHA layer cache makes the
      # later multi-arch build reuse this work for linux/amd64.
      - name: Build the image (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: assembly/Dockerfile
          platforms: linux/amd64
          load: true
          tags: tools:ci
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
            CREATED=${{ steps.meta.outputs.created }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Running the image is the point: a packaging regression that stops
      # SampleApp from launching — or from logging — is invisible to
      # `docker build` alone. Both assertions matter; an image that starts but
      # prints nothing is how the previous fat jar failed.
      - name: Smoke-test the image
        run: |
          set -euo pipefail
          mkdir -p smoke
          printf 'id,name,country\n1,Alice,PL\n2,Bob,US\n3,Carol,PL\n' > smoke/people.csv
          not_unique=$(docker run --rm -v "$PWD/smoke:/data:ro" tools:ci /data/people.csv country)
          unique=$(docker run --rm -v "$PWD/smoke:/data:ro" tools:ci /data/people.csv id)
          echo "${not_unique}"
          echo "${unique}"
          echo "${not_unique}" | grep -q 'country is NOT unique'
          echo "${unique}" | grep -q 'id is unique'

      # Fails the release on fixable HIGH/CRITICAL findings, so a vulnerable
      # base image is caught before the push rather than after.
      - name: Scan the image for vulnerabilities
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: tools:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'release'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only now, with the image proven to run and scanned, publish it — tagged
      # with the release version as well as `latest`, and for both Linux
      # architectures the trimmed DuckDB driver still carries natives for.
      - name: Push the image to GHCR
        if: github.event_name == 'release'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: assembly/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
            ${{ env.IMAGE }}:latest
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
            CREATED=${{ steps.meta.outputs.created }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max
