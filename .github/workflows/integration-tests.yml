name: Integration Tests

on:
  schedule:
    - cron: '0 0 * * *'

# Least privilege: this build only reads the repository. Nothing here writes to
# it, comments on a pull request, or publishes anything.
permissions:
  contents: read

# One run of this nightly job at a time. Unlike a pull-request build it is never
# superseded by a newer commit, so an in-flight run is left to finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  integration-tests:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Set up JDK 25
      uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven
    - name: Run the integration tests (MCP over HTTP, adoption against real GitHub URLs)
      run: mvn -B -ntp verify -P integration-tests --file pom.xml
