name: Java CI with Maven (Windows)

# Weekly build on Windows to catch platform-specific regressions that the
# Linux-based "Java CI with Maven" workflow would miss. Runs mvn install on a
# windows-latest runner every Sunday.
on:
  schedule:
    # Sundays at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:

# Least privilege: this build only reads the repository. Nothing here writes to
# it, comments on a pull request, or publishes anything.
permissions:
  contents: read

# One run of this weekly job at a time. Unlike a pull-request build it is never
# superseded by a newer commit, so an in-flight run is left to finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
    - name: Set up JDK 25
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      # No enforcer bootstrap is needed here: this build does not pass
      # -DenforceClaudeMd, so the claude-md-enforce profile stays off and the
      # tools.claude-code-enforcer plugin dependency is never consumed. The
      # enforcer module is still built as an ordinary reactor module by
      # `install`. CLAUDE.md-format enforcement is platform-independent and is
      # already covered by the Linux "Java CI with Maven" workflow; this Windows
      # job exists to catch platform-specific regressions.
      run: mvn -B -ntp install --file pom.xml
