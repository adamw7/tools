# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

# Only build main on push and PRs targeting main. Leaving `push` unfiltered
# meant a push to a branch that also had an open PR fired both the `push` and
# `pull_request` events, running the whole build twice for the same commit.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Least privilege: this build only reads the repository. Nothing here writes to
# it, comments on a pull request, or publishes anything.
permissions:
  contents: read

# A second push to a pull request supersedes the first. This build caps itself at
# 120 seconds to keep the feedback loop tight; letting a superseded run finish
# anyway spends a runner on an answer nobody is waiting for.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
    - name: Set up JDK 25
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven
    - name: Bootstrap CLAUDE.md enforcer rule
      # The custom enforcer rule (tools.claude-code-enforcer) is consumed as a
      # maven-enforcer-plugin dependency by the root build, so it must be
      # installed to the local repo first. The claude-md-enforce profile is
      # off here (no -DenforceClaudeMd), so the module is not asked to depend
      # on itself while it is being built.
      #
      # -DskipTests: this step exists only to publish the enforcer JAR so the
      # main build can load it as a plugin dependency. The module's own test
      # suite is re-run as part of the "Build with Maven" package step below,
      # so running it here as well only duplicates work.
      run: mvn -B -ntp -pl claude-code-enforcer -am install -DskipTests
    - name: Build with Maven
      # -DenforceClaudeMd activates the claude-md-enforce profile so the root
      # build fails when CLAUDE.md is missing or malformed. This is the only
      # workflow that runs the check.
      #
      # timeout-minutes: 2 caps the build at 120 seconds. The duration check
      # below reports and fails on an overrun, but it can only run once mvn has
      # returned: a build that wedges outright would sit there until the job's
      # 6-hour default limit. The step timeout is what actually kills it at the
      # same 120s bound. Scoped to this step, not the job, so the checkout, JDK
      # setup and enforcer bootstrap do not eat into the build's budget.
      timeout-minutes: 2
      run: |
        start=$(date +%s)
        mvn -B -ntp package -DenforceClaudeMd --file pom.xml
        end=$(date +%s)
        duration=$((end - start))
        echo "Build took ${duration} seconds."
        if [ "${duration}" -gt 120 ]; then
          echo "::error::Build exceeded the 2 minute (120s) limit: ${duration}s"
          exit 1
        fi
