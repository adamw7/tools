# Console logging config for the container images (assembly/Dockerfile and
# k8s/Dockerfile), selected with -Dlog4j2.configurationFile.
#
# It replaces rather than supplements the `data` module's bundled config, which
# has only a RollingFile appender under a relative `logs/` path. In a container
# that path is wrong twice over: nothing tails it, and the Kubernetes Job runs
# with readOnlyRootFilesystem, so creating the directory fails outright. Logging
# to the console instead puts SampleApp's result straight in `docker logs` /
# `kubectl logs`.
#
# The `data` module's own config is deliberately left file-only: its MCP server
# speaks JSON-RPC over stdio by default, and a stdout appender there would
# corrupt the protocol stream.
status = warn
name = ConsoleConfig

appender.console.type = Console
appender.console.name = STDOUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yyyy-MM-dd HH:mm:ss.SSS} %level - %msg%n

rootLogger.level = info
rootLogger.appenderRef.stdout.ref = STDOUT
